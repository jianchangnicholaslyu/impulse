<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夕夕电竞 - 轻度版</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/main.js"></script>
  <script>
    if (window.location.protocol === "file:") {
      var legacyStyles = document.createElement("link");
      legacyStyles.rel = "stylesheet";
      legacyStyles.href = "styles.css";
      document.head.appendChild(legacyStyles);

      window.addEventListener("DOMContentLoaded", function () {
        var legacyScript = document.createElement("script");
        legacyScript.src = "app.js";
        document.body.appendChild(legacyScript);
      });
    }
  </script>
</head>
<body class="customer-mode app-loading">
  <div class="app-loader notranslate" id="appLoader" role="status" aria-live="polite" aria-label="正在加载夕夕电竞" translate="no">
    <div class="app-loader-card">
      <div class="app-loader-icon" aria-hidden="true">
        <span>夕</span>
      </div>
      <div class="app-loader-copy">
        <strong>正在加载夕夕电竞</strong>
        <span>正在准备轻度版交易入口</span>
      </div>
      <div class="app-loader-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
  <noscript><style>.app-loader{display:none!important;}</style></noscript>

  <header class="topbar">
    <button class="brand notranslate" id="brandButton" type="button" data-action="go-home" aria-label="返回首页" translate="no">
      <span class="brand-mark">夕</span>
      <span class="brand-wordmark" aria-label="夕夕电竞">
        <span class="brand-roman">夕夕电竞</span>
        <span class="brand-script">轻度版</span>
      </span>
    </button>

    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="搜索游戏、服务、账号" autocomplete="off">
      <button type="submit" aria-label="搜索">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span>搜索</span>
      </button>
    </form>

    <div class="top-actions" id="topActions"></div>
  </header>

  <main class="shell">
    <section class="hero-panel fade-in" id="heroPanel"></section>
    <nav class="breadcrumb" id="breadcrumb" aria-label="当前位置"></nav>
    <section class="content-zone" id="contentZone" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="#/about">关于我们</a>
      <a href="#/terms">服务条款</a>
      <a href="#/privacy">隐私政策</a>
      <a href="#/refund">退款规则</a>
      <a href="#/payment">支付规则</a>
      <a href="#/points">积分规则</a>
      <a href="#/dispute">争议规则</a>
      <a href="#/withdrawal">提现规则</a>
      <a href="#/help">帮助中心</a>
    </div>
    <p>Copyright © 2026 夕夕电竞。保留所有权利。</p>
  </footer>

  <div class="modal-root" id="modalRoot"></div>
  <div class="context-menu hidden" id="contextMenu"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
</body>
</html>
